name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  run-foundation:
    name: RUN foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra cpu
      - name: Lint and formatting
        run: |
          uv run --no-sync ruff check run tests/run tests/e2e
          uv run --no-sync ruff format --check run tests/run tests/e2e
      - name: Pull trusted test images
        run: |
          docker pull alpine:3.20
          docker pull python:3.12-alpine
      - name: Unit and Docker integration tests
        run: uv run --no-sync pytest -m "not gpu" tests/run tests/e2e --junitxml=artifacts/pytest.xml
