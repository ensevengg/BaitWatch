[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "baitwatch"
version = "0.1.0"
description = "Catches prompt-injection attacks aimed at AI coding agents before they run in a repo."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "torch",
    "transformers>=5.0",
    "docker>=7.1,<8",
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
train = ["pyarrow", "scikit-learn"]
test = ["pytest"]
dev = ["pytest>=8.3,<10", "pytest-timeout>=2.3,<3", "jsonschema>=4.23,<5", "ruff>=0.11,<1"]
# uv only: `--extra cpu` selects the CPU torch build; otherwise torch comes from PyPI as with pip.
cpu = ["torch"]
cuda = ["torch"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[project.scripts]
# `baitwatch` itself is reserved for the fused READ + RUN CLI.
baitwatch-read = "read.cli:main"
baitwatch-run = "run.cli:app"

[tool.setuptools.packages.find]
include = ["read*", "run*"]

[tool.setuptools.package-data]
read = ["model_config.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# An extra-scoped source needs a conflicting pair, hence the cuda extra pointing at PyPI.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pypi", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true
